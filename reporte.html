<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Lectura Natal · Astrea Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #0B1220;
    --gold: #D4B172;
    --gold-soft: #E6CB98;
    --ink: #F4EEDF;
    --ink-soft: rgba(244, 238, 223, 0.72);
    --hairline: rgba(212, 177, 114, 0.45);
    --papel-destacado: rgba(212, 177, 114, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background-color: var(--cream);
    background-image: url("assets/fondo.png");
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .portada {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
  }

  .logo-mini {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    letter-spacing: 0.1em;
    margin-bottom: 30px;
  }

  .logo-mini .sub {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 8px;
    letter-spacing: 0.3em;
    color: var(--gold);
    margin-top: 2px;
  }

  .portada-titulo {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 40px;
    color: var(--ink);
  }

  .portada-divisor {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }

  .portada-divisor::before,
  .portada-divisor::after {
    content: "";
    height: 1px;
    width: 70px;
    background: linear-gradient(to left, var(--gold), transparent);
  }
  .portada-divisor::after { background: linear-gradient(to right, var(--gold), transparent); }

  .portada-nombre {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: var(--gold-soft);
    margin: 10px 0;
  }

  .portada-meta {
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .rueda-natal-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 20px 0;
  }
  .rueda-natal-wrap svg { width: 100%; max-width: 340px; height: auto; }
  .rueda-signo-simbolo { font-family: 'Cormorant Garamond', serif; font-size: 13px; fill: var(--gold); text-anchor: middle; dominant-baseline: middle; }
  .rueda-planeta-simbolo { font-family: 'Cormorant Garamond', serif; font-size: 15px; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
  .rueda-casa-numero { font-family: 'DM Sans', sans-serif; font-size: 9px; fill: var(--ink-soft); text-anchor: middle; dominant-baseline: middle; }
  .rueda-eje-label { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; fill: var(--gold); text-anchor: middle; dominant-baseline: middle; }

  .capitulo {
    padding: 48px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .capitulo:last-of-type { border-bottom: none; }

  .capitulo-numero {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  h2.capitulo-titulo {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 27px;
    color: var(--ink);
    margin-bottom: 22px;
  }

  h2.capitulo-titulo::after {
    content: "";
    display: block;
    width: 56px;
    height: 2px;
    background-color: var(--gold);
    margin-top: 12px;
  }

  .overview, .conclusion {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    background: var(--papel-destacado);
    padding: 20px 22px;
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
    white-space: pre-line;
  }

  .mirada-esencia {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 21px;
    color: var(--gold-soft);
    text-align: center;
    margin-bottom: 26px;
  }

  .mirada-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }

  .mirada-card {
    flex: 1 1 220px;
    background: rgba(11, 18, 32, 0.5);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 18px 20px;
  }

  .mirada-card-titulo {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .mirada-lista { list-style: none; }
  .mirada-lista li { font-size: 13.5px; margin-bottom: 8px; padding-left: 18px; position: relative; }
  .mirada-lista.talentos li::before { content: "✔"; position: absolute; left: 0; color: var(--gold); }
  .mirada-lista.desafios li::before { content: "▸"; position: absolute; left: 0; color: var(--ink-soft); }

  .mirada-mision {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    background: var(--papel-destacado);
    padding: 20px 22px;
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
  }

  .mirada-mision-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    font-style: normal;
    display: block;
    margin-bottom: 8px;
  }

  .como-leer-texto { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 12px; }
  .como-leer-bullets { list-style: none; margin: 20px 0; }
  .como-leer-bullets li { font-size: 14px; margin-bottom: 12px; padding-left: 22px; position: relative; color: var(--ink); }
  .como-leer-bullets li::before { content: "✦"; position: absolute; left: 0; color: var(--gold); }

  .como-leer-cita {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    background: var(--papel-destacado);
    padding: 20px 22px;
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
    margin-top: 24px;
  }

  .pagina-cierre { text-align: center; padding: 60px 20px; }
  .frase-cierre {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 24px;
    max-width: 460px;
    margin: 0 auto;
    color: var(--gold-soft);
  }

  .panorama-grid { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
  .panorama-card {
    flex: 1 1 220px;
    background: rgba(11, 18, 32, 0.5);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .panorama-titulo { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--gold); margin-bottom: 10px; }
  .panorama-fila { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; }
  .panorama-etiqueta { width: 56px; color: var(--ink-soft); }
  .panorama-barra { flex: 1; height: 7px; background: var(--hairline); border-radius: 4px; overflow: hidden; }
  .panorama-relleno { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .panorama-valor { width: 16px; text-align: right; }
  .panorama-dominante { margin-top: 10px; font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; }

  .lectura-patron {
    margin-top: 20px;
    padding: 18px 22px;
    border: 1px solid var(--gold);
    border-radius: 8px;
  }
  .lectura-patron-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .lectura-patron-texto { font-size: 14px; color: var(--ink); }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
  th { text-align: left; padding: 8px 8px; color: var(--gold); text-transform: uppercase; font-size: 9.5px; letter-spacing: 1px; border-bottom: 1.5px solid var(--gold); }
  td { padding: 8px 8px; border-bottom: 1px solid var(--hairline); color: var(--ink); }
  .retrogrado { color: var(--gold); }

  .planeta-bloque {
    margin-bottom: 18px;
    padding: 20px 22px;
    background: rgba(11, 18, 32, 0.5);
    border: 1px solid var(--hairline);
    border-radius: 8px;
  }
  .planeta-bloque:last-child { margin-bottom: 0; }
  .planeta-encabezado { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .planeta-simbolo { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold); }
  h3.planeta-nombre { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 17px; color: var(--ink); }
  .planeta-datos { font-size: 10.5px; color: var(--ink-soft); margin-bottom: 12px; }
  .interpretacion-texto { font-size: 14px; color: var(--ink); text-align: justify; }

  .disclaimer {
    margin-top: 46px;
    padding-top: 20px;
    border-top: 1px solid var(--hairline);
    font-size: 9.5px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.7;
  }

  .cargando {
    text-align: center;
    padding: 80px 20px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-soft);
  }

  .error-box {
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  @media (max-width: 480px) {
    .portada-titulo { font-size: 32px; }
    h2.capitulo-titulo { font-size: 23px; }
    .mirada-grid, .panorama-grid { flex-direction: column; }
  }
</style>
</head>
<body>

<div id="cargando" class="cargando">Preparando tu lectura...</div>
<div id="contenido-reporte" style="display:none;"></div>

<script src="rueda-natal.js"></script>
<script src="reporte.js"></script>
</body>
</html>
