<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrea Charts · Próximamente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF6EC;
    --gold: #8C5F24;
    --gold-soft: #D4A85C;
    --ink: #241C10;
    --ink-soft: #5A4E3B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(180deg, #FFFCF6 0%, var(--cream) 40%, #F3E9D6 100%);
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 44px 20px 48px;
  }

  .wrap {
    max-width: 380px;
    margin: 0 auto;
    text-align: center;
    padding-top: 60px;
  }

  .logo-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 36px;
    letter-spacing: 0.04em;
  }

  .logo-sub {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 6px;
  }

  .glyph {
    color: var(--gold-soft);
    font-size: 26px;
    margin: 26px 0 14px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.25;
    color: var(--ink);
  }

  p {
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 300px;
    margin: 16px auto 32px;
    line-height: 1.6;
  }

  .btn-generar {
    display: inline-block;
    background: linear-gradient(135deg, var(--gold-soft), #C99A4B);
    color: #241C10;
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    padding: 14px 24px;
    border-radius: 6px;
  }

  .volver {
    display: block;
    margin-top: 22px;
    color: var(--gold);
    font-size: 13px;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-name">ASTREA<span class="logo-sub">— CHARTS —</span></div>
  <div class="glyph">✦</div>
  <h1>La experiencia completa está en camino</h1>
  <p>Estamos construyendo un espacio para que explores todo el universo Astrea. Mientras tanto, puedes calcular tu carta gratis.</p>
  <a href="/link-gratis" class="btn-generar">Calcular mi carta gratis</a>
  <a href="/link" class="volver">← Volver a inicio</a>
</div>

</body>
</html>
